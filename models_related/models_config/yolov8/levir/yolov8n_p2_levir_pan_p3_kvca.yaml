nc: 1
p2_offset_regression: false
scale: n
scales: {n: [0.33, 0.25, 1024]}
backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, true]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, true]]
  - [-1, 1, SPPF, [1024, 5]]
head:
  - [-1, 1, nn.Upsample, [null, 2, nearest]] # 10
  - [[-1, 6], 1, Concat, [1]] # 11
  - [-1, 3, C2f, [512]] # 12
  - [-1, 1, nn.Upsample, [null, 2, nearest]] # 13
  - [[-1, 4], 1, Concat, [1]] # 14
  - [-1, 3, C2f, [256]] # 15 (P3 FPN)
  - [-1, 1, nn.Upsample, [null, 2, nearest]] # 16
  - [[-1, 2], 1, Concat, [1]] # 17
  - [-1, 3, C2f, [128]] # 18 (P2 FPN)
  - [18, 1, Conv, [128, 3, 2]] # 19 (P2 -> P3)
  - [[-1, 15], 1, Concat, [1]] # 20
  - [-1, 3, C2f, [256]] # 21 (P3 PAN)

  # Shared KVCA before Detect Head
  - [18, 1, KVCompressedTransformerEncoder, [128, 4, 8, dwconv, 0.1]] # 22 (P2 KVCA)
  - [21, 1, KVCompressedTransformerEncoder, [256, 4, 4, dwconv, 0.1]] # 23 (P3 KVCA)
  
  - [[22, 23], 1, Detect, [nc]] # 24
