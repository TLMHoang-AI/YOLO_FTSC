nc: 1
p2_offset_regression: false
scale: n
scales: {n: [0.33, 0.25, 1024]}
backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, true]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, true]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, true]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, true]]
  - [-1, 1, SPPF, [1024, 5]]
head:
  # Top-Down FPN path
  - [-1, 1, nn.Upsample, [null, 2, nearest]] # 10 (stride 16)
  - [[-1, 6], 1, Concat, [1]]                 # 11
  - [-1, 3, C2f, [512]]                        # 12 (P4 FPN)
  
  - [-1, 1, nn.Upsample, [null, 2, nearest]] # 13 (stride 8)
  - [[-1, 4], 1, Concat, [1]]                 # 14
  - [-1, 3, C2f, [256]]                        # 15 (P3 FPN)
  
  - [-1, 1, nn.Upsample, [null, 2, nearest]] # 16 (stride 4)
  - [[-1, 2], 1, Concat, [1]]                 # 17
  - [-1, 3, C2f, [128]]                        # 18 (P2 FPN)
  
  # P1-GER (A2) gated rescue on top-down P2
  - [[18, 0], 1, P1GER, [3]]                   # 19 (gated rescued P2 FPN)
  
  # Detect head receives only P2 (19) and P3 (15)
  - [[19, 15], 1, Detect, [nc]]                # 20
